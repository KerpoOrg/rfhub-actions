name: acceptance-run
description: >-
  Queue a Hub acceptance definition for this commit (or reuse an existing
  green report) and wait until the auto-created report verdict is passed.
inputs:
  project:
    description: Hub project id or display name
    required: true
  token:
    description: Hub API token
    required: true
  acceptance:
    description: Acceptance definition slug
    required: false
    default: pr
  environment:
    description: Project environment slug (selects the orchestrator)
    required: false
    default: dev
outputs:
  passed:
    description: true when the acceptance report verdict is passed
    value: ${{ steps.run.outputs.passed }}
  groupId:
    description: Acceptance run group id when a new run was queued
    value: ${{ steps.run.outputs.groupId }}
  reportId:
    description: Acceptance report id when passed
    value: ${{ steps.run.outputs.reportId }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        RFHUB_TOKEN: ${{ inputs.token }}
        RFHUB_PROJECT: ${{ inputs.project }}
        RFHUB_ACCEPTANCE: ${{ inputs.acceptance }}
        RFHUB_ENVIRONMENT: ${{ inputs.environment }}
        GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: python3 "$GITHUB_ACTION_PATH/../rfhub.py" acceptance-run
